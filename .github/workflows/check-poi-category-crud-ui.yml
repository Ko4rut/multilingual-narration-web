name: Check POI Category Admin CRUD UI
on:
  push:
    branches: [feature/poi-category-crud-ui]
  pull_request:
    paths:
      - "src/features/poi-categories/**"
      - "src/i18n/messages.ts"
      - ".github/workflows/check-poi-category-crud-ui.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
